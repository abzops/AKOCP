name: AKOCP feature checks
on:
  pull_request:
    branches: [master, feat/sarvam-receptionist]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:db
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/receptionist/index.ts supabase/functions/receptionist-recording/index.ts supabase/functions/receptionist-status/index.ts
      - run: npm run test:edge
      - run: npm run build
